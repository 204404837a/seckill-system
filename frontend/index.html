<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>秒杀系统</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/index.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
      .el-input__inner {
          border-radius: 20px;
      }
  </style>
</head>
<body>
<div id="app">
  <form class="search-bar" @submit.prevent="searchShops">
    <span class="city-btn">杭州</span>
    <div class="search-input">
      <el-input id="search" ref="search" size="mini" v-model="keyword" placeholder="请输入商户名" aria-label="商户名称"></el-input>
      <button class="search-submit" type="submit">搜索</button>
    </div>
    <a class="header-icon" href="/info.html" aria-label="个人主页"><i class="el-icon-user"></i></a>
  </form>
  <div class="type-list">
    <a class="type-box" v-for="t in types" :key="t.id" :href="shopListUrl(t)">
      <div class="type-view"><img :src="'/imgs/' + t.icon" alt=""></div>
      <div class="type-text">{{t.name}}</div>
    </a>
  </div>
  <div class="blog-list" @scroll="onScroll">
    <div class="blog-box" v-for="b in blogs" :key="b.id">
      <a class="blog-img" :href="'/blog-detail.html?id=' + b.id" :aria-label="b.title"><img v-if="b.img" :src="b.img" alt=""></a>
      <a class="blog-title" :href="'/blog-detail.html?id=' + b.id">{{b.title}}</a>
      <div class="blog-foot">
        <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></div>
        <div class="blog-user-name">{{b.name}}</div>
        <button class="blog-liked" type="button" aria-label="点赞" :aria-pressed="!!b.isLike" @click="addLike(b)">
          <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
            <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="b.isLike ? '#ff6633' : '#82848a'"></path>
          </svg>
          {{b.liked}}
        </button>
      </div>
    </div>
  </div>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      keyword: "",
      loadingBlogs: false,
      hasMoreBlogs: true,
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
    },
    created() {
      // 查询类型
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    mounted() {
      if (location.hash === "#search") this.$refs.search.focus();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryHotBlogsScroll() {
        if (this.loadingBlogs || !this.hasMoreBlogs) return;
        this.loadingBlogs = true;
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            const blogs = data || [];
            this.hasMoreBlogs = blogs.length > 0;
            this.blogs = this.blogs.concat(blogs.map(b => ({...b, img: (b.images || "").split(",")[0]})));
            this.current++;
          })
          .catch(err => {
            this.$message.error(err)
          })
          .finally(() => this.loadingBlogs = false);
      },
      addLike(b) {
        axios.put("/blog/like/" +b.id)
          .then(({data}) => {
            this.queryBlogById(b)
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(this.$message.error)
      },
      onScroll(e) {
        const {scrollTop, clientHeight, scrollHeight} = e.target;
        if (scrollHeight - scrollTop - clientHeight <= 16) {
          this.queryHotBlogsScroll();
        }
      },
      searchShops() {
        const keyword = this.keyword.trim();
        if (keyword) {
          location.href = "/shop-list.html?" + new URLSearchParams({keyword});
        }
      },
      shopListUrl(type) {
        return "/shop-list.html?" + new URLSearchParams({type: type.id, name: type.name});
      }
    }
  })
</script>
</body>
</html>
